<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SK打卡系統</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://accounts.google.com">
<link rel="preconnect" href="https://api.ipify.org">
<link rel="dns-prefetch" href="https://script.google.com">
<meta name="theme-color" content="#1b1f3b">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#11132b; --panel:#1b1f3b; --accent:#ffb454; --accent-soft:#ffb45422;
    --text:#f4f2ec; --text-dim:#9a9bbf; --ok:#5fd187; --err:#ff6b6b; --line:#2c3060;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(circle at 50% -10%, #262a52 0%, var(--bg) 55%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",sans-serif;
    color:var(--text); display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:420px; background:var(--panel);
    border:1px solid var(--line); border-radius:20px; padding:28px 24px 24px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  }
  .clock{text-align:center; margin-bottom:18px;}
  .clock .time{font-size:42px; font-weight:700; letter-spacing:1px; font-variant-numeric:tabular-nums;}
  .clock .date{color:var(--text-dim); font-size:13px; margin-top:4px;}
  h1{
    font-size:15px; font-weight:600; text-align:center; color:var(--text-dim);
    letter-spacing:2px; text-transform:uppercase; margin:0 0 20px;
  }
  label{display:block; font-size:12px; color:var(--text-dim); margin:14px 0 6px; letter-spacing:0.5px;}
  input, select, textarea{
    width:100%; background:#00000033; border:1px solid var(--line); border-radius:12px;
    color:var(--text); padding:13px 14px; font-size:15px; font-family:inherit; appearance:none;
  }
  textarea{resize:none; min-height:54px;}
  .types{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
  .type-btn{
    border:1px solid var(--line); background:#00000033; color:var(--text);
    padding:14px 8px; border-radius:12px; font-size:14px; cursor:pointer; transition:all .15s ease;
  }
  .type-btn.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600;}
  .submit-btn{
    width:100%; margin-top:22px; padding:16px; border:none; border-radius:14px;
    background:var(--accent); color:#1b1f3b; font-size:16px; font-weight:700;
    cursor:pointer; transition:opacity .15s ease;
  }
  .submit-btn:disabled{opacity:.4; cursor:not-allowed;}
  .status{
    margin-top:16px; padding:13px 14px; border-radius:12px; font-size:13px;
    line-height:1.5; display:none; white-space:pre-line;
  }
  .status.show{display:block;}
  .status.ok{background:#5fd18722; color:var(--ok); border:1px solid #5fd18755;}
  .status.err{background:#ff6b6b22; color:var(--err); border:1px solid #ff6b6b55;}
  .ip-line{text-align:center; color:var(--text-dim); font-size:11px; margin-top:16px;}
  .user-row{
    display:flex; align-items:center; gap:10px; background:#00000033;
    border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:18px;
  }
  .user-row .name{font-size:14px; font-weight:600;}
  .user-row .email{font-size:11px; color:var(--text-dim);}
  .user-row button{
    margin-left:auto; background:none; border:none; color:var(--text-dim);
    font-size:12px; text-decoration:underline; cursor:pointer;
  }
  /* 豁免申請 Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.75);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:100;
  }
  .modal-overlay.hidden{display:none;}
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:24px; width:100%; max-width:400px; max-height:90vh; overflow-y:auto;
  }
  .modal h2{font-size:17px; font-weight:700; margin:0 0 6px; color:var(--text);}
  .modal p{font-size:13px; color:var(--text-dim); margin:0 0 18px; line-height:1.5;}
  .modal-btns{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;}
  .modal-btn-yes{
    padding:13px; border:none; border-radius:12px;
    background:var(--accent); color:#1b1f3b; font-size:15px; font-weight:700; cursor:pointer;
  }
  .modal-btn-no{
    padding:13px; border:1px solid var(--line); border-radius:12px;
    background:none; color:var(--text-dim); font-size:15px; cursor:pointer;
  }
  .photo-preview{
    width:100%; max-height:160px; object-fit:cover;
    border-radius:10px; margin-top:8px; display:none;
  }
  /* 申請紀錄 Modal */
  .record-item{
    background:#00000033; border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:10px;
  }
  .record-item .rec-time{font-size:11px; color:var(--text-dim); margin-bottom:4px;}
  .record-item .rec-reason{font-size:13px; color:var(--text); margin-bottom:6px;}
  .record-item .rec-remark{font-size:12px; color:var(--text-dim);}
  .badge{
    display:inline-block; padding:3px 10px; border-radius:20px;
    font-size:12px; font-weight:600; margin-bottom:6px;
  }
  .badge-pending{background:#ffb45433; color:var(--accent);}
  .badge-approved{background:#5fd18733; color:var(--ok);}
  .badge-rejected{background:#ff6b6b33; color:var(--err);}
  .modal-close{
    width:100%; margin-top:14px; padding:12px; border:1px solid var(--line);
    border-radius:12px; background:none; color:var(--text-dim); font-size:14px; cursor:pointer;
  }
  /* Greeting Toast */
  .toast{
    position:fixed; bottom:40px; left:50%; transform:translateX(-50%) translateY(120px);
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:18px 28px; text-align:center; z-index:200;
    box-shadow:0 20px 50px -10px rgba(0,0,0,0.7);
    transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s ease;
    opacity:0; min-width:260px; max-width:320px;
  }
  .toast.show{transform:translateX(-50%) translateY(0); opacity:1;}
  .toast.hide{transform:translateX(-50%) translateY(120px); opacity:0;}
  .toast .toast-emoji{font-size:44px; display:block; margin-bottom:8px;}
  .toast .toast-msg{font-size:18px; font-weight:700; color:var(--text);}
  .toast .toast-sub{font-size:13px; color:var(--text-dim); margin-top:4px;}
  /* Birthday special */
  .toast.birthday{border-color:#ffb454; background:linear-gradient(135deg,#1b1f3b,#2a1f3b);}
  .toast.birthday .toast-msg{color:var(--accent);}
</style>
</head>
<body>
<div class="card">
  <div class="clock">
    <div class="time" id="timeNow">--:--:--</div>
    <div class="date" id="dateNow">----</div>
  </div>
  <h1>SK打卡系統</h1>

  <div id="loginSection" style="display:flex; flex-direction:column; align-items:center; gap:14px; padding:10px 0 6px;">
    <div id="googleBtn"></div>
    <div style="color:var(--text-dim); font-size:13px; text-align:center;">請用Google帳號登入先打到卡</div>
    <div class="status" id="loginStatus"></div>
  </div>

  <div id="appSection" style="display:none;">
    <div class="user-row">
      <div>
        <div class="name" id="userName"></div>
        <div class="email" id="userEmailDisplay"></div>
      </div>
      <button id="logoutBtn">登出</button>
    </div>

    <label>打卡類型</label>
    <div class="types" id="typeGroup"></div>

    <label for="remarkInput">備註（選填）</label>
    <textarea id="remarkInput" placeholder="例如：交通延誤、外勤..."></textarea>

    <button class="submit-btn" id="submitBtn">打卡</button>
    <div class="status" id="statusBox"></div>
    <div class="ip-line" id="ipLine">檢測網絡中...</div>
    <button id="viewExemptionsBtn" style="
      width:100%; margin-top:12px; padding:12px; border:1px solid var(--line);
      border-radius:14px; background:none; color:var(--text-dim);
      font-size:14px; cursor:pointer;">
      📋 查看我的豁免申請
    </button>
  </div>
</div>

<!-- Greeting Toast -->
<div class="toast" id="greetingToast">
  <span class="toast-emoji" id="toastEmoji"></span>
  <div class="toast-msg" id="toastMsg"></div>
  <div class="toast-sub" id="toastSub"></div>
</div>

<!-- 查看申請紀錄 Modal -->
<div class="modal-overlay hidden" id="exemptionListModal">
  <div class="modal">
    <h2>📋 我的豁免申請</h2>
    <div id="exemptionListContent">
      <div style="text-align:center; color:var(--text-dim); padding:20px;">載入緊...</div>
    </div>
    <button class="modal-close" id="closeExemptionListBtn">關閉</button>
  </div>
</div>
<div class="modal-overlay hidden" id="exemptionModal">
  <div class="modal">
    <h2>⏰ 遲到豁免申請</h2>
    <p>你嘅返工時間係遲到時段（12:46 - 14:00），需要申請豁免嗎？</p>
    <div id="exemptionAskBtns" class="modal-btns">
      <button class="modal-btn-yes" id="exemptionYesBtn">需要申請</button>
      <button class="modal-btn-no" id="exemptionNoBtn">唔需要</button>
    </div>
    <div id="exemptionForm" style="display:none;">
      <label>原因 <span style="color:var(--err)">*</span></label>
      <textarea id="exemptionReason" placeholder="請填寫遲到原因..." style="min-height:80px;"></textarea>
      <label style="margin-top:12px;">上載相片（選填）</label>
      <input type="file" id="exemptionPhoto" accept="image/*" capture="environment"
        style="color:var(--text-dim);font-size:13px;padding:8px 0;">
      <img id="photoPreview" class="photo-preview">
      <button class="modal-btn-yes" id="exemptionSubmitBtn" style="width:100%;margin-top:16px;">提交申請</button>
      <div class="status" id="exemptionStatus"></div>
    </div>
  </div>
</div>

<script>
// ====== 設定：請改成你自己新Apps Script嘅 Web App 網址 ======
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxsO66PYovYoR2RNh_NM8qpv0Vm2cjExl-ta0JoMyc6DaMhZhoCF1lZMlSUfR1KrgX/exec";
var GOOGLE_CLIENT_ID = "564783152398-5dkc0roiqrgh89308u02fhmgdch8pk41.apps.googleusercontent.com";
var CHECK_TYPES = ["返工", "放工", "放break", "完break"];
// 遲到check設定
var LATE_EMPLOYEES = ["CK", "HOSON", "MO"];
var LATE_START = { h: 12, m: 46 };
var LATE_END   = { h: 14, m: 0 };

function isLateTime() {
  var now = new Date();
  var h = now.getHours(), m = now.getMinutes();
  var totalMin = h * 60 + m;
  return totalMin >= LATE_START.h * 60 + LATE_START.m &&
         totalMin < LATE_END.h * 60 + LATE_END.m;
}
function isLateEmployee(name) {
  return LATE_EMPLOYEES.indexOf(name) !== -1;
}

var currentSelectedType = null;
var currentUserIP = null;
var session = null; // { idToken, name, email }

function saveSession(){
  try {
    localStorage.setItem('sk_checkin_user', JSON.stringify({
      name: session.name, email: session.email, birthday: session.birthday || ""
    }));
  } catch(e){}
}
function loadCachedUser(){
  try {
    var raw = localStorage.getItem('sk_checkin_user');
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function clearCachedUser(){
  try { localStorage.removeItem('sk_checkin_user'); } catch(e){}
}

// 判斷今日係咪生日（MM-DD格式）
function checkBirthdayToday(birthdayStr) {
  if (!birthdayStr) return false;
  var today = new Date();
  var mm = String(today.getMonth() + 1).padStart(2, '0');
  var dd = String(today.getDate()).padStart(2, '0');
  var todayMMDD = mm + '-' + dd;
  var normalized = birthdayStr.replace(/\//g, '-').substring(0, 5);
  return normalized === todayMMDD;
}

// ====== 時鐘 ======
function tickClock(){
  var now = new Date();
  document.getElementById('timeNow').textContent = now.toLocaleTimeString('zh-HK',{hour12:false});
  document.getElementById('dateNow').textContent = now.toLocaleDateString('zh-HK',{weekday:'long', year:'numeric', month:'long', day:'numeric'});
}
setInterval(tickClock, 1000);
tickClock();

// ====== 打卡類型按鈕 ======
function buildTypeButtons(){
  var group = document.getElementById('typeGroup');
  CHECK_TYPES.forEach(function(type){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'type-btn';
    btn.textContent = type;
    btn.onclick = function(){
      document.querySelectorAll('.type-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      currentSelectedType = type;
    };
    group.appendChild(btn);
  });
}
buildTypeButtons();

// ====== 攞 Public IP ======
function loadIP(){
  fetch('https://api.ipify.org?format=json')
    .then(function(r){ return r.json(); })
    .then(function(d){
      currentUserIP = d.ip;
      document.getElementById('ipLine').textContent = "目前IP: " + d.ip;
    })
    .catch(function(){
      document.getElementById('ipLine').textContent = "無法檢測IP，請檢查網絡連線";
    });
}
loadIP();

// ====== 登入 ======
// ====== Google 登入 ======
window.onload = function(){
  // 先check有冇記住登入狀態
  var cachedUser = loadCachedUser();
  if (cachedUser){
    // 有記住 → 直接入打卡畫面，唔需要再登入
    session = { idToken: null, name: cachedUser.name, email: cachedUser.email, birthday: cachedUser.birthday || "" };
    document.getElementById('userName').textContent = cachedUser.name;
    document.getElementById('userEmailDisplay').textContent = cachedUser.email;
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('appSection').style.display = 'block';
    // 生日check（開App就顯示）
    if (checkBirthdayToday(cachedUser.birthday)) {
      setTimeout(function(){ showToast('🎂✨', 'Happy Birthday!', cachedUser.name + '，生日快樂！🥳', true); }, 600);
    }
    // 背景靜默攞返新token（打卡時用），失敗都唔影響UI
    initGoogleSilent();
    return;
  }
  // 冇記住 → 顯示Google登入掣
  initGoogleButton();
};

function initGoogleButton(){
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
    auto_select: true,
    cancel_on_tap_outside: false
  });
  google.accounts.id.renderButton(
    document.getElementById('googleBtn'),
    { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with' }
  );
  google.accounts.id.prompt();
}

function initGoogleSilent(){
  // 靜悄悄攞返新token，唔干擾用戶
  try {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: function(response){
        if (session) session.idToken = response.credential;
      },
      auto_select: true,
      cancel_on_tap_outside: false
    });
    google.accounts.id.prompt(function(){});
  } catch(e){}
}

function handleCredentialResponse(response){
  var idToken = response.credential;
  var statusBox = document.getElementById('loginStatus');
  statusBox.className = 'status';

  fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'login', idToken: idToken })
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if (data.success){
      session = { idToken: idToken, name: data.name, email: data.email, birthday: data.birthday || "" };
      saveSession();
      document.getElementById('userName').textContent = data.name;
      document.getElementById('userEmailDisplay').textContent = data.email;
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('appSection').style.display = 'block';
      // 生日check（登入就顯示）
      if (data.isBirthday) {
        setTimeout(function(){ showToast('🎂✨', 'Happy Birthday!', data.name + '，生日快樂！🥳', true); }, 600);
      }
    } else {
      showStatus(statusBox, '✗ ' + data.message, false);
    }
  })
  .catch(function(err){
    showStatus(statusBox, '✗ 連線失敗: ' + err, false);
  });
}

document.getElementById('logoutBtn').onclick = function(){
  session = null;
  currentSelectedType = null;
  document.querySelectorAll('.type-btn').forEach(function(b){ b.classList.remove('active'); });
  clearCachedUser();
  google.accounts.id.disableAutoSelect();
  document.getElementById('appSection').style.display = 'none';
  document.getElementById('loginSection').style.display = 'flex';
};

// ====== 打卡 ======
document.getElementById('submitBtn').onclick = function(){
  var statusBox = document.getElementById('statusBox');
  var remark = document.getElementById('remarkInput').value;

  if (!session){
    showStatus(statusBox, '請先登入', false);
    return;
  }
  if (!currentSelectedType){
    showStatus(statusBox, '請揀打卡類型', false);
    return;
  }
  if (!currentUserIP){
    showStatus(statusBox, '未能檢測網絡IP，請稍後再試', false);
    return;
  }

  // 如果有token就直接打卡，冇token就先靜默攞一個再打卡
  if (session.idToken){
    doCheckIn(remark);
  } else {
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '驗證身份中...';
    // 靜默攞token（用戶唔會見到登入畫面）
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: function(response){
        session.idToken = response.credential;
        doCheckIn(remark);
      },
      auto_select: true
    });
    google.accounts.id.prompt(function(notification){
      if (notification.isNotDisplayed() || notification.isSkippedMoment()){
        // 靜默攞唔到，要求手動登入一次
        btn.disabled = false;
        btn.textContent = '打卡';
        clearCachedUser();
        session = null;
        document.getElementById('appSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'flex';
        initGoogleButton();
        showStatus(document.getElementById('loginStatus'), '請重新登入一次', false);
      }
    });
  }
};

function doCheckIn(remark){
  var btn = document.getElementById('submitBtn');
  var statusBox = document.getElementById('statusBox');
  btn.disabled = true;
  btn.textContent = '處理緊...';

  fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action: 'checkin',
      idToken: session.idToken,
      checkType: currentSelectedType,
      remark: remark,
      userIP: currentUserIP
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    btn.disabled = false;
    btn.textContent = '打卡';
    if (data.success){
      showStatus(statusBox, '✓ ' + data.message + '\n' + data.employee + ' · ' + data.type + ' · ' + data.time, true);
      document.getElementById('remarkInput').value = '';
      session.idToken = null;
      // 顯示Greeting Toast
      if (data.isBirthday) {
    showToast('🎂✨', 'Happy Birthday! ' + data.employee + '，生日快樂！🥳', '', true);
} else {
    showGreeting(data.type, data.employee);
}
      // 返工 + 遲到時段 + 指定員工 → 彈出豁免申請modal
      if (data.type === '返工' && isLateEmployee(data.employee) && isLateTime()) {
        setTimeout(function(){ showExemptionModal(data.time); }, 800);
      }
    } else {
      showStatus(statusBox, '✗ ' + data.message, false);
      session.idToken = null;
    }
  })
  .catch(function(err){
    btn.disabled = false;
    btn.textContent = '打卡';
    showStatus(statusBox, '✗ 連線失敗，請檢查網絡: ' + err, false);
  });
}

function showStatus(box, msg, ok){
  box.textContent = msg;
  box.className = 'status show ' + (ok ? 'ok' : 'err');
}

// ====== Greeting Toast ======
var toastTimer = null;
function showGreeting(checkType, employeeName) {
  var emoji = '', msg = '';
  var now = new Date();
  var isBefore1pm = now.getHours() < 13;

  if (checkType === '返工') {
    if (isBefore1pm) { emoji = '☀️'; msg = '早晨，' + employeeName + '！'; }
    else              { emoji = '🌤️'; msg = '午安~~ ' + employeeName + '！'; }
  } else if (checkType === '放break') {
    emoji = '🍚'; msg = '夠鐘食飯~~~';
  } else if (checkType === '完break') {
    emoji = '😋'; msg = '';
  } else if (checkType === '放工') {
    emoji = '🎉'; msg = '放工大吉！辛苦晒！';
  }

  var isBirthday = session && checkBirthdayToday(session.birthday);
  if (isBirthday) {
    // 所有打卡類型生日當日都顯示，普通greeting(如有)放下面
    var sub = (emoji || msg) ? emoji + ' ' + msg : '';
    showToast('🎂✨', 'Happy Birthday! ' + employeeName + '，生日快樂！🥳', sub, true);
  } else {
    if (emoji || msg) showToast(emoji, msg, '', false);
  }
}

function showToast(emoji, msg, sub, isBirthday) {
  var toast = document.getElementById('greetingToast');
  document.getElementById('toastEmoji').textContent = emoji;
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastSub').textContent = sub || '';
  toast.className = 'toast' + (isBirthday ? ' birthday' : '');
  // 強制reflow先加show
  void toast.offsetWidth;
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    toast.classList.remove('show');
    toast.classList.add('hide');
    setTimeout(function(){ toast.classList.remove('hide'); }, 400);
  }, 3000);
}

// ====== 查看申請紀錄 ======
document.getElementById('viewExemptionsBtn').onclick = function(){
  var modal = document.getElementById('exemptionListModal');
  var content = document.getElementById('exemptionListContent');
  modal.classList.remove('hidden');
  content.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:20px;">載入緊...</div>';

  // 攞token再查詢
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: function(resp){
      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'getMyExemptions', idToken: resp.credential })
      })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (!data.success){
          content.innerHTML = '<div style="color:var(--err);text-align:center;padding:20px;">載入失敗: ' + data.message + '</div>';
          return;
        }
        if (data.records.length === 0){
          content.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:20px;">未有申請紀錄</div>';
          return;
        }
        var html = '';
        data.records.forEach(function(rec){
          var badgeClass = rec.status === '批准' ? 'badge-approved' : rec.status === '拒絕' ? 'badge-rejected' : 'badge-pending';
          var remarkHtml = rec.remark ? '<div class="rec-remark">備註: ' + rec.remark + '</div>' : '';
          html += '<div class="record-item">' +
            '<div class="rec-time">申請時間: ' + rec.applyTime + '　打卡: ' + rec.checkTime + '</div>' +
            '<span class="badge ' + badgeClass + '">' + rec.status + '</span>' +
            '<div class="rec-reason">' + rec.reason + '</div>' +
            remarkHtml +
            '</div>';
        });
        content.innerHTML = html;
      })
      .catch(function(err){
        content.innerHTML = '<div style="color:var(--err);text-align:center;padding:20px;">連線失敗</div>';
      });
    },
    auto_select: true
  });
  google.accounts.id.prompt(function(n){
    if (n.isNotDisplayed() || n.isSkippedMoment()){
      content.innerHTML = '<div style="color:var(--err);text-align:center;padding:20px;">身份驗證失敗，請重新登入</div>';
    }
  });
};

// 相片預覽
document.getElementById('exemptionPhoto').onchange = function(){
  var file = this.files[0];
  if (!file) return;
  var preview = document.getElementById('photoPreview');
  var reader = new FileReader();
  reader.onload = function(e){ preview.src = e.target.result; preview.style.display = 'block'; };
  reader.readAsDataURL(file);
};

// 壓縮圖片 (max 800px, quality 0.6)
function compressPhoto(file, callback) {
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maxW = 800, maxH = 800;
      var w = img.width, h = img.height;
      if (w > maxW){ h = h * maxW / w; w = maxW; }
      if (h > maxH){ w = w * maxH / h; h = maxH; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.6), 'image/jpeg');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

document.getElementById('exemptionSubmitBtn').onclick = function(){
  var reason = document.getElementById('exemptionReason').value.trim();
  var statusBox = document.getElementById('exemptionStatus');
  if (!reason){ showStatus(statusBox, '請填寫遲到原因', false); return; }

  var btn = document.getElementById('exemptionSubmitBtn');
  btn.disabled = true; btn.textContent = '提交緊...';

  var photoFile = document.getElementById('exemptionPhoto').files[0];

  function submitExemption(photoBase64, photoMime) {
    // 攞新token再提交
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: function(resp){
        fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'applyExemption',
            idToken: resp.credential,
            reason: reason,
            photoBase64: photoBase64 || '',
            photoMimeType: photoMime || '',
            checkTime: exemptionCheckTime
          })
        })
        .then(function(r){ return r.json(); })
        .then(function(data){
          btn.disabled = false; btn.textContent = '提交申請';
          if (data.success){
            showStatus(statusBox, '✓ ' + data.message, true);
            setTimeout(function(){ document.getElementById('exemptionModal').classList.add('hidden'); }, 2000);
          } else {
            showStatus(statusBox, '✗ ' + data.message, false);
          }
        })
        .catch(function(err){
          btn.disabled = false; btn.textContent = '提交申請';
          showStatus(statusBox, '✗ 連線失敗: ' + err, false);
        });
      },
      auto_select: true
    });
    google.accounts.id.prompt(function(n){
      if (n.isNotDisplayed() || n.isSkippedMoment()){
        btn.disabled = false; btn.textContent = '提交申請';
        showStatus(statusBox, '✗ 身份驗證失敗，請重新登入', false);
      }
    });
  }

  if (photoFile){
    compressPhoto(photoFile, function(base64, mime){ submitExemption(base64, mime); });
  } else {
    submitExemption('', '');
  }
};
